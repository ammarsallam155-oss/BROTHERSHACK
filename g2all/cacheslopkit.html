<!DOCTYPE html>
<html lang="ar" dir="rtl" manifest="slopkit.manifest">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BROTHERSHACK - GoldHEN Host</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<script>
history.replaceState(null,null,'index.html');var histlength=history.length;history.go(-histlength);
function DLProgress(e){Percent=(Math.round(e.loaded / e.total * 100));window.msgs.innerHTML="جاري تثبيت الكاش أوفلاين: " + Percent + "%";}
function DisplayCacheProgress(){window.msgs.innerHTML="تم تثبيت الكاش بنجاح ✔";setTimeout(function(){window.msgs.innerHTML="الآن أغلق المتصفح وافتحه من جديد ...";},1500);}
window.applicationCache.addEventListener("progress",DLProgress,false);
window.applicationCache.oncached=function(e){DisplayCacheProgress();};
window.applicationCache.onupdateready=function(e){DisplayCacheProgress();};
window.applicationCache.onerror=function(e){window.msgs.innerHTML="حدث خطأ أثناء تثبيت الكاش - أغلق المتصفح وافتحه من جديد ...";};
</script>
<h1>BROTHERSHACK</h1>
<hr>
<br>
<h1 id=msgs style="font-size: 30px;margin-top: 77px;margin-bottom: 455px;">يرجى الانتظار، جاري تثبيت الكاش أوفلاين...</h1>

</body>
</html>
